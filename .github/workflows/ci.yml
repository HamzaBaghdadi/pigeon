name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generated credentials must never be committed
        run: |
          if git ls-files --error-unmatch services/release_credentials.go 2>/dev/null; then
            echo "::error::services/release_credentials.go is committed. Remove it and rotate the Google client secret."
            exit 1
          fi

  go:
    name: Go (vet, test, vulncheck)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable   # latest Go, so releases include security fixes
          check-latest: true
      - name: Placeholder for the embedded frontend
        shell: bash
        run: mkdir -p frontend/dist && echo ok > frontend/dist/index.html
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Windows app build
    runs-on: windows-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable   # latest Go, so releases include security fixes
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Build
        run: wails3 build
      - uses: actions/upload-artifact@v4
        with:
          name: pigeon-windows
          path: bin/pigeon.exe
